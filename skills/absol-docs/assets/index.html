<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Documentation · NAS Home Lab</title>
  <link rel="stylesheet" href="/docs/_assets/css/base.css">
  <link rel="stylesheet" href="/docs/_assets/css/index.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <main class="hub">
    <a class="hub-back" href="/">← Dashboard</a>

    <header class="hub-header">
      <p class="hub-eyebrow">Documentation</p>
      <h1>Project documentation</h1>
      <p class="hub-subtitle">Project docs and knowledge-base entries. Expand a card to see its pages.</p>
    </header>

    <section class="hub-section" aria-labelledby="hub-projects-heading">
      <h2 id="hub-projects-heading" class="hub-section-title">Projects</h2>
      <div id="hub-grid-projects" class="hub-grid" aria-live="polite"></div>
    </section>

    <section class="hub-section" aria-labelledby="hub-kb-heading">
      <h2 id="hub-kb-heading" class="hub-section-title">Knowledge base</h2>
      <div id="hub-grid-kb" class="hub-grid" aria-live="polite"></div>
    </section>
  </main>

  <template id="card-template">
    <details class="project-card">
      <summary>
        <span class="project-icon"><i></i></span>
        <span class="project-meta">
          <p class="project-name"></p>
          <p class="project-desc"></p>
        </span>
        <span class="project-toggle">›</span>
      </summary>
      <ul class="project-docs"></ul>
    </details>
  </template>

  <script>
    (async () => {
      const gridProjects = document.getElementById("hub-grid-projects");
      const gridKb       = document.getElementById("hub-grid-kb");
      const tpl          = document.getElementById("card-template");

      let registry;
      try {
        const res = await fetch("/docs/_assets/docs-registry.json", { cache: "no-cache" });
        if (!res.ok) throw new Error(`registry fetch ${res.status}`);
        registry = await res.json();
      } catch (err) {
        gridProjects.innerHTML = `
          <div class="hub-empty">
            <p><strong>Couldn't load the docs registry.</strong></p>
            <p>Expected at <code>/docs/_assets/docs-registry.json</code>.</p>
            <p><small>${String(err)}</small></p>
          </div>`;
        return;
      }

      const entries = (registry && registry.projects) || [];
      const projects = entries.filter(e => (e.category || "project") === "project");
      const kb       = entries.filter(e => e.category === "kb");

      const pad = n => String(n).padStart(2, "0");

      const renderEmpty = (grid, msg) => {
        grid.innerHTML = `<div class="hub-empty"><p>${msg}</p></div>`;
      };

      const renderInto = (grid, list, defaultIcon) => {
        if (list.length === 0) return;
        for (const p of list) {
          const card = tpl.content.firstElementChild.cloneNode(true);
          card.querySelector(".project-icon i").className = p.icon || defaultIcon;
          card.querySelector(".project-name").textContent = p.name || p.slug;
          card.querySelector(".project-desc").textContent = p.description || "";

          const ul = card.querySelector(".project-docs");
          const docs = p.docs || [];
          if (docs.length === 0) {
            const li = document.createElement("li");
            li.innerHTML = `<a><span class="doc-title" style="color:var(--text-muted)">No pages yet.</span></a>`;
            ul.appendChild(li);
          } else {
            docs.forEach((d, i) => {
              const li = document.createElement("li");
              const a  = document.createElement("a");
              a.href = `/docs/${p.slug}/${d.path}`;
              a.innerHTML = `
                <span class="doc-num">${pad(i + 1)}</span>
                <span class="doc-title"></span>
                <span class="doc-arrow">→</span>`;
              a.querySelector(".doc-title").textContent = d.title;
              li.appendChild(a);
              ul.appendChild(li);
            });
          }

          grid.appendChild(card);
        }
      };

      if (projects.length === 0) renderEmpty(gridProjects, "No projects registered yet. Run <code>/absol-docs add &lt;slug&gt;</code> to add one.");
      else renderInto(gridProjects, projects, "fas fa-file-code");

      if (kb.length === 0) renderEmpty(gridKb, "No knowledge-base entries yet.");
      else renderInto(gridKb, kb, "fas fa-book");
    })();
  </script>
</body>
</html>
